# docker-compose.template.yml
# Template base del Integrador 360 — versionar en el repo.
# El docker-compose.yml real del servidor se genera a partir de este
# + los contenedores de clientes que se agregan via API provisioning.
#
# Uso:
#   1. Copiar a /opt/integrador/docker-compose.yml en el servidor
#   2. Crear /opt/integrador/.env con las variables reales
#   3. docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: pg-integrador
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrador
      POSTGRES_USER: integrador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/integrador/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrador"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 2g
    # En producción: NO exponer puerto al host. Los contenedores
    # se conectan por red interna Docker (hostname: postgres)
    # ports:
    #   - "5432:5432"

  api:
    image: integrador-360
    container_name: api-integrador
    restart: unless-stopped
    group_add:
      - "109"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    environment:
      - ENV=${ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - /etc/integrador/gcp-key.json:/etc/integrador/gcp-key.json:ro
      - /etc/integrador/credentials:/etc/integrador/credentials
      - /var/log/integrador:/var/log/integrador
      - /etc/integrador/excel:/etc/integrador/excel
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/integrador/docker-compose.yml:/opt/integrador/docker-compose.yml
      - /etc/integrador/ssh-keys:/etc/integrador/ssh-keys
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1g

  frontend:
    image: integrador-360-frontend
    container_name: front-integrador
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    mem_limit: 128m

# ─── Contenedores de clientes ───────────────────────────────
# Los siguientes se agregan automaticamente desde el panel
# via POST /clients/{id}/provision.
# Cada cliente sigue este patron:
#
#   integrador-{slug}:
#     image: integrador-360
#     container_name: integrador-{slug}
#     restart: unless-stopped
#     depends_on:
#       postgres:
#         condition: service_healthy
#     environment:
#       - CLIENT_ID={slug}
#       - DATABASE_URL=${DATABASE_URL}
#       - ENV=${ENV}
#       - GCP_PROJECT_ID=${GCP_PROJECT_ID}
#       - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
#     volumes:
#       - /etc/integrador/gcp-key.json:/etc/integrador/gcp-key.json:ro
#       - /etc/integrador/credentials:/etc/integrador/credentials
#       - /var/log/integrador:/var/log/integrador
#     mem_limit: 512m
#
# Si el cliente usa SSH tunnel, agregar:
#       - /etc/integrador/ssh-keys:/etc/integrador/ssh-keys:ro
