<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Integrador 360 — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --azul-fondo: #121a2b;
    --azul-1: #1d3557;
    --azul-2: #0f3460;
    --cian: #4cc9f0;
    --cian-claro: #7bdff2;
    --texto-claro: #eaf6ff;
    --texto-oscuro: #1a1a2e;
    --gris: #8b93a1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    background: #fff;
    color: var(--texto-oscuro);
  }
  a { color: var(--azul-2); }
  a:hover { color: #16213e; }

  .login { display: flex; min-height: 100vh; }

  /* ---------- Panel izquierdo (60%) ---------- */
  .panel-visual {
    flex: 0 0 60%;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 20% 12%, var(--azul-1) 0%, rgba(29,53,87,0) 60%),
      radial-gradient(100% 80% at 85% 95%, var(--azul-2) 0%, rgba(15,52,96,0) 65%),
      var(--azul-fondo);
  }
  .halo { position: absolute; border-radius: 50%; pointer-events: none; }
  .halo-1 {
    width: 520px; height: 520px; top: -160px; right: -140px;
    background: radial-gradient(circle, rgba(56,120,220,.28) 0%, rgba(56,120,220,0) 70%);
    animation: floatY 12s ease-in-out infinite;
  }
  .halo-2 {
    width: 380px; height: 380px; bottom: -120px; left: -100px;
    background: radial-gradient(circle, rgba(0,180,216,.22) 0%, rgba(0,180,216,0) 70%);
    animation: floatY2 14s ease-in-out infinite;
  }

  .panel-visual__contenido {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 5vw, 72px);
    padding-bottom: clamp(180px, 26vh, 260px);
  }
  .esquema { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: clamp(24px, 4vh, 40px); }
  .esquema svg { width: 100%; height: auto; overflow: visible; }

  .metricas { display: flex; gap: 22px; align-items: flex-end; }
  .metricas__item { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .metricas__valor {
    color: var(--texto-claro);
    font-size: clamp(19px, 2.2vw, 24px);
    font-weight: 600;
    letter-spacing: -.01em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .metricas__etiqueta { color: rgba(255,255,255,.48); font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .metricas__sep { flex: 0 0 1px; width: 1px; height: 38px; background: rgba(255,255,255,.14); }
  .punto-estado {
    flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%;
    background: #5fd39a;
    animation: tick 2.4s ease-in-out infinite;
  }

  .titular {
    position: absolute;
    left: clamp(32px, 5vw, 72px);
    right: clamp(32px, 5vw, 72px);
    bottom: clamp(32px, 5vw, 64px);
    max-width: 620px;
  }
  .titular h1 {
    margin: 0 0 14px;
    color: #fff;
    font-size: clamp(32px, 4.2vw, 52px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .titular p {
    margin: 0;
    color: rgba(255,255,255,.72);
    font-size: clamp(15px, 1.6vw, 19px);
    line-height: 1.5;
    text-wrap: pretty;
  }

  /* ---------- Panel derecho (40%) ---------- */
  .panel-acceso {
    flex: 1 1 40%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 40px 32px;
    animation: panelIn .8s cubic-bezier(.22,.8,.3,1) both;
  }
  .panel-acceso__centro {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo { width: 250px; max-width: 82%; height: auto; margin-bottom: 48px; }
  .panel-acceso h2 { margin: 0 0 10px; font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .panel-acceso__sub { margin: 0 0 36px; font-size: 15px; color: var(--gris); line-height: 1.5; }

  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 15px 20px;
    border: 1px solid #dfe3e9;
    border-radius: 12px;
    background: #fff;
    color: var(--texto-oscuro);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .btn-google:hover { box-shadow: 0 8px 24px rgba(15,52,96,.14); border-color: #c6cdd8; transform: translateY(-1px); }
  .btn-google:active { transform: translateY(0); }

  .pie { margin: 0; font-size: 12px; color: #b6bcc7; }

  /* ---------- Animaciones ---------- */
  @keyframes floatY  { 0%,100% { transform: translateY(0); }   50% { transform: translateY(-14px); } }
  @keyframes floatY2 { 0%,100% { transform: translateY(0); }   50% { transform: translateY(10px); } }
  @keyframes flow    { to { stroke-dashoffset: 0; } }
  @keyframes pulseNode { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes hubGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(76,201,240,.22); } 50% { box-shadow: 0 0 0 18px rgba(76,201,240,0); } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes tick { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: translateY(0); } }

  .flujo path { animation: flow 5.4s cubic-bezier(.55,0,.35,1) infinite; }
  .flujo path:nth-child(2) { animation-delay: .45s; }
  .flujo path:nth-child(3) { animation-delay: .9s; }
  .flujo--salida path { animation-delay: 2.1s; }
  .flujo--salida path:nth-child(2) { animation-delay: 2.55s; }
  .flujo--salida path:nth-child(3) { animation-delay: 3s; }
  .orbita { transform-origin: 310px 150px; animation: spinSlow 80s linear infinite; }
  .hub { animation: hubGlow 5.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  /* ---------- Responsive: en móvil solo queda el panel derecho ---------- */
  @media (max-width: 860px) {
    .panel-visual { display: none; }
    .panel-acceso { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<main class="login">

  <section class="panel-visual">
    <div class="halo halo-1"></div>
    <div class="halo halo-2"></div>

    <div class="panel-visual__contenido">
      <div class="esquema">

        <svg viewBox="0 0 620 300" aria-label="ERP conectado con WMS a través del Integrador 360">
          <defs>
            <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.10)" />
              <stop offset="100%" stop-color="rgba(255,255,255,.03)" />
            </linearGradient>
          </defs>

          <rect x="14" y="86" width="96" height="128" rx="16" fill="url(#plate)" stroke="rgba(160,200,255,.30)" />
          <g fill="rgba(180,215,255,.5)">
            <rect x="38" y="112" width="48" height="7" rx="3.5" />
            <rect x="38" y="127" width="48" height="7" rx="3.5" opacity=".6" />
            <rect x="38" y="142" width="30" height="7" rx="3.5" opacity=".35" />
          </g>
          <text x="62" y="184" text-anchor="middle" fill="rgba(255,255,255,.78)" font-family="Inter, sans-serif" font-size="15" font-weight="600" letter-spacing="1.6">ERP</text>

          <rect x="510" y="86" width="96" height="128" rx="16" fill="url(#plate)" stroke="rgba(160,200,255,.30)" />
          <g fill="rgba(180,215,255,.5)">
            <rect x="534" y="112" width="48" height="7" rx="3.5" opacity=".35" />
            <rect x="534" y="127" width="48" height="7" rx="3.5" opacity=".6" />
            <rect x="534" y="142" width="30" height="7" rx="3.5" />
          </g>
          <text x="558" y="184" text-anchor="middle" fill="rgba(255,255,255,.78)" font-family="Inter, sans-serif" font-size="15" font-weight="600" letter-spacing="1.6">WMS</text>

          <g stroke="rgba(150,195,255,.22)" stroke-width="1.4" fill="none">
            <path d="M110 112 C 195 112, 205 150, 262 150" />
            <path d="M110 150 L262 150" />
            <path d="M110 188 C 195 188, 205 150, 262 150" />
            <path d="M358 150 C 415 150, 425 112, 510 112" />
            <path d="M358 150 L510 150" />
            <path d="M358 150 C 415 150, 425 188, 510 188" />
          </g>

          <g class="flujo" stroke="#4cc9f0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="26 400" stroke-dashoffset="426">
            <path d="M110 112 C 195 112, 205 150, 262 150" />
            <path d="M110 150 L262 150" />
            <path d="M110 188 C 195 188, 205 150, 262 150" />
          </g>

          <g class="flujo flujo--salida" stroke="#7bdff2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="26 400" stroke-dashoffset="426">
            <path d="M358 150 C 415 150, 425 112, 510 112" />
            <path d="M358 150 L510 150" />
            <path d="M358 150 C 415 150, 425 188, 510 188" />
          </g>

          <g class="orbita">
            <circle cx="310" cy="150" r="74" fill="none" stroke="rgba(160,200,255,.16)" stroke-width="1.2" stroke-dasharray="4 12" />
          </g>
          <rect class="hub" x="262" y="102" width="96" height="96" rx="28" fill="rgba(76,201,240,.10)" stroke="rgba(76,201,240,.55)" stroke-width="1.6" />
          <text x="310" y="140" text-anchor="middle" fill="rgba(234,246,255,.62)" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1.6">INTEGRADOR</text>
          <text x="310" y="172" text-anchor="middle" fill="#eaf6ff" font-family="Inter, sans-serif" font-size="28" font-weight="700">360</text>
        </svg>

        <div class="metricas">
          <div class="metricas__item">
            <span class="metricas__valor" id="m-docs">1.284</span>
            <span class="metricas__etiqueta">documentos sincronizados hoy</span>
          </div>
          <div class="metricas__sep"></div>
          <div class="metricas__item">
            <span class="metricas__valor" id="m-int">6</span>
            <span class="metricas__etiqueta">integraciones activas</span>
          </div>
          <div class="metricas__sep"></div>
          <div class="metricas__item">
            <span class="metricas__valor"><span class="punto-estado"></span>En línea</span>
            <span class="metricas__etiqueta">última corrida hace <span id="m-seg">8</span>&nbsp;s</span>
          </div>
        </div>

      </div>

      <div class="titular">
        <h1>Integrador 360</h1>
        <p>Plataforma interna de integración entre sistemas</p>
      </div>
    </div>
  </section>

  <section class="panel-acceso">
    <div></div>

    <div class="panel-acceso__centro">
      <img class="logo" src="logo-360.png" alt="360 Software" />
      <h2>Bienvenido</h2>
      <p class="panel-acceso__sub">Inicia sesión con tu cuenta corporativa</p>

      <button type="button" class="btn-google">
        <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.3 17.7 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.3 5.7c4.3-3.9 6.8-9.8 6.8-17.1z" />
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C.9 16.3 0 20 0 24s.9 7.7 2.6 10.8l7.8-6.1z" />
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-3.8-13.6-9.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z" />
        </svg>
        Continuar con Google
      </button>
    </div>

    <p class="pie">© 360 Software — v1.0.0</p>
  </section>

</main>

<!-- Solo mueve los números de la maqueta. Bórralo al conectar datos reales. -->
<script>
  setInterval(function () {
    document.getElementById('m-docs').textContent = (900 + Math.floor(Math.random() * 3200)).toLocaleString('es-CO');
    document.getElementById('m-int').textContent = 3 + Math.floor(Math.random() * 12);
    document.getElementById('m-seg').textContent = 1 + Math.floor(Math.random() * 59);
  }, 2000);
</script>

</body>
</html>
