<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Integrador 360 — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --sidebar: #001529;
    --sidebar-sub: #000c17;
    --azul: #1890ff;
    --contenido: #f0f2f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: rgba(0,0,0,.85);
    background: var(--contenido);
  }
  a { color: var(--azul); text-decoration: none; }
  a:hover { color: #40a9ff; }

  .layout { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    flex: 0 0 auto;
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width .22s cubic-bezier(.2,.8,.3,1);
  }
  .sidebar.is-collapsed { width: 80px; }

  .sidebar__marca {
    flex: 0 0 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .sidebar__marca img { height: 34px; width: auto; max-width: none; }
  .sidebar.is-collapsed .logo-completo { display: none; }
  .logo-marca { display: none; }
  .sidebar.is-collapsed .logo-marca { display: block; }

  .menu { flex: 1 1 auto; padding: 8px 0; display: flex; flex-direction: column; }

  .menu__item,
  .menu__subitem {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    cursor: pointer;
    color: rgba(255,255,255,.72);
    background: transparent;
    border-left: 3px solid transparent;
    font-size: 14px;
    user-select: none;
    transition: background .16s ease, color .16s ease;
  }
  .menu__item { height: 44px; }
  .menu__subitem { height: 40px; padding: 0 20px 0 44px; }
  .menu__item:hover,
  .menu__subitem:hover { background: rgba(255,255,255,.10); color: #fff; }
  .menu__item.is-active,
  .menu__subitem.is-active {
    color: #fff;
    background: rgba(24,144,255,.20);
    border-left-color: var(--azul);
  }
  .menu__item svg,
  .menu__subitem svg { flex: 0 0 16px; }
  .menu__item.is-active svg,
  .menu__subitem.is-active svg { stroke: #fff; }

  .menu__texto { white-space: nowrap; }
  .menu__caret { margin-left: auto; font-size: 10px; transition: transform .2s ease; }
  .menu__item.is-open .menu__caret { transform: rotate(90deg); }

  .submenu { background: var(--sidebar-sub); display: none; flex-direction: column; padding: 4px 0; }
  .menu__item.is-open + .submenu { display: flex; }

  .sidebar.is-collapsed .menu__texto,
  .sidebar.is-collapsed .menu__caret { display: none; }
  .sidebar.is-collapsed .menu__item,
  .sidebar.is-collapsed .menu__subitem { justify-content: center; padding: 0; }

  .colapsar {
    flex: 0 0 48px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 22px;
    cursor: pointer;
    color: rgba(255,255,255,.6);
    border-top: 1px solid rgba(255,255,255,.06);
    font-size: 22px;
    line-height: 1;
    user-select: none;
    transition: background .16s ease, color .16s ease;
  }
  .colapsar:hover { background: rgba(255,255,255,.08); color: #fff; }

  /* ---------- Cuerpo ---------- */
  .cuerpo { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  .header {
    flex: 0 0 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 24px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,21,41,.08);
    position: relative;
    z-index: 5;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; color: rgba(0,0,0,.45); }
  .breadcrumb__sep { color: rgba(0,0,0,.25); }
  .breadcrumb__actual { color: rgba(0,0,0,.85); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .usuario { display: flex; align-items: center; gap: 14px; }
  .usuario__nombre { font-size: 14px; white-space: nowrap; }

  .badge {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 9px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge--superadmin { color: #cf1322; background: #fff1f0; border: 1px solid #ffa39e; }
  .badge--admin      { color: #096dd9; background: #e6f7ff; border: 1px solid #91d5ff; }
  .badge--viewer     { color: #389e0d; background: #f6ffed; border: 1px solid #b7eb8f; }

  .rueda-wrap { position: relative; }
  .rueda {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(0,0,0,.55);
    background: transparent;
    transition: background .16s ease, color .16s ease;
  }
  .rueda:hover,
  .rueda-wrap.is-open .rueda { background: #f0f5ff; color: var(--azul); }

  .dropdown {
    display: none;
    position: absolute;
    top: 40px; right: 0;
    min-width: 168px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,.12), 0 3px 6px rgba(0,0,0,.06);
    padding: 4px;
    z-index: 10;
  }
  .rueda-wrap.is-open .dropdown { display: block; }
  .dropdown__correo { padding: 8px 12px; font-size: 12px; color: rgba(0,0,0,.45); border-bottom: 1px solid #f0f0f0; }
  .dropdown__accion {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background .14s ease;
  }
  .dropdown__accion:hover { background: #f5f5f5; }

  .contenido { flex: 1 1 auto; padding: 24px; background: var(--contenido); }
  .contenido__placeholder {
    min-height: 320px;
    height: 100%;
    background: #fff;
    border-radius: 8px;
    border: 1px dashed #d9d9d9;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,0,0,.35);
    font-size: 15px;
  }

  @media (max-width: 820px) {
    .sidebar { width: 80px; }
    .sidebar .logo-completo { display: none; }
    .sidebar .logo-marca { display: block; }
    .sidebar .menu__texto, .sidebar .menu__caret { display: none; }
    .sidebar .menu__item, .sidebar .menu__subitem { justify-content: center; padding: 0; }
    .usuario__nombre { display: none; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar__marca">
      <img class="logo-completo" src="logo-360-claro.png" alt="360 Software" />
      <img class="logo-marca" src="logo-360-marca.png" alt="360" />
    </div>

    <nav class="menu">

      <div class="menu__item is-active" data-nav="Tablero">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z" /></svg>
        <span class="menu__texto">Tablero</span>
      </div>

      <div class="menu__item" data-nav="Flujos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6M14 6h6M4 18h6M14 18h6M10 6a4 4 0 004 4M10 18a4 4 0 014-4" /></svg>
        <span class="menu__texto">Flujos</span>
      </div>

      <div class="menu__item" data-nav="Ejecuciones">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l11 7-11 7z" /></svg>
        <span class="menu__texto">Ejecuciones</span>
      </div>

      <div class="menu__item" data-nav="Auditoría">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7zM10 8h4M10 12h4M10 16h2" /></svg>
        <span class="menu__texto">Auditoría</span>
      </div>

      <div class="menu__item" id="admin-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z" /></svg>
        <span class="menu__texto">Admin</span>
        <span class="menu__caret">▶</span>
      </div>

      <div class="submenu">
        <div class="menu__subitem" data-nav="Clientes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 100-6M16 15c3 0 6 2 6 5" /></svg>
          <span class="menu__texto">Clientes</span>
        </div>
        <div class="menu__subitem" data-nav="Usuarios">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6" /></svg>
          <span class="menu__texto">Usuarios</span>
        </div>
      </div>

    </nav>

    <div class="colapsar" id="colapsar" title="Colapsar">←</div>

  </aside>

  <!-- ============ Cuerpo ============ -->
  <div class="cuerpo">

    <header class="header">
      <div class="breadcrumb">
        <span>Integrador 360</span>
        <span class="breadcrumb__sep">/</span>
        <span class="breadcrumb__actual" id="breadcrumb">Tablero</span>
      </div>

      <div class="usuario">
        <span class="usuario__nombre">Jorge Rivera</span>
        <span class="badge badge--superadmin">Superadmin</span>

        <div class="rueda-wrap" id="rueda-wrap">
          <div class="rueda" id="rueda" title="Opciones">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
              <path d="M9.9 2.1h3.2l.5 2.5 1.9.8 2.2-1.3 2.2 2.2-1.3 2.2.8 1.9 2.5.5v3.2l-2.5.5-.8 1.9 1.3 2.2-2.2 2.2-2.2-1.3-1.9.8-.5 2.5H9.9l-.5-2.5-1.9-.8-2.2 1.3-2.2-2.2 1.3-2.2-.8-1.9-2.5-.5v-3.2l2.5-.5.8-1.9-1.3-2.2 2.2-2.2 2.2 1.3 1.9-.8z" />
              <circle cx="11.5" cy="11.5" r="3.1" />
            </svg>
          </div>

          <div class="dropdown">
            <div class="dropdown__correo">jorge.rivera@360software.com.co</div>
            <div class="dropdown__accion">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4H6v16h8M17 8l4 4-4 4M21 12H10" /></svg>
              Cerrar sesión
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="contenido">
      <div class="contenido__placeholder">Contenido de la página aquí</div>
    </main>

  </div>

</div>

<!-- Interacciones del layout: colapsar, submenú, item activo, dropdown. -->
<script>
  var sidebar = document.getElementById('sidebar');
  var colapsar = document.getElementById('colapsar');
  var ruedaWrap = document.getElementById('rueda-wrap');
  var breadcrumb = document.getElementById('breadcrumb');
  var adminToggle = document.getElementById('admin-toggle');

  colapsar.addEventListener('click', function () {
    sidebar.classList.toggle('is-collapsed');
    colapsar.textContent = sidebar.classList.contains('is-collapsed') ? '→' : '←';
  });

  adminToggle.addEventListener('click', function () {
    adminToggle.classList.toggle('is-open');
  });

  document.querySelectorAll('[data-nav]').forEach(function (el) {
    el.addEventListener('click', function () {
      document.querySelectorAll('.is-active').forEach(function (a) { a.classList.remove('is-active'); });
      el.classList.add('is-active');
      breadcrumb.textContent = el.getAttribute('data-nav');
    });
  });

  document.getElementById('rueda').addEventListener('click', function (e) {
    e.stopPropagation();
    ruedaWrap.classList.toggle('is-open');
  });
  document.addEventListener('click', function () { ruedaWrap.classList.remove('is-open'); });
</script>

</body>
</html>
